services:
  # 1. FastAPI 後端 Web Service
  - type: web
    name: delivery-backend
    env: python
    plan: free # 強制宣告使用免費方案，避免 Render 要求輸入信用卡號
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # 不在設定檔硬編碼敏感連線字串，由 Render 部署時提示手動輸入
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production

  # 2. React 前端 Static Site 服務
  - type: web
    name: delivery-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
